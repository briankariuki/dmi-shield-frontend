<form [formGroup]="dashboardGroupForm" (ngSubmit)="onFormSubmit()">
  <div style="margin-top: 24px; margin-bottom: 24px; display: flex">
    <div style="flex: 2 1 0%">
      <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block"
        >Dashboard Group Name</mat-label
      >
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <mat-label>Name</mat-label>

        <input matInput placeholder="" formControlName="name" />

        <mat-error *ngIf="dashboardGroupForm.get('name').hasError('required')">
          Required
        </mat-error>
      </mat-form-field>
    </div>
  </div>
  <div style="margin-top: 24px; margin-bottom: 24px; display: flex">
    <div style="flex: 2 1 0%">
      <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block"
        >Dashboard Group Description</mat-label
      >
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <mat-label>Description</mat-label>

        <textarea matInput placeholder="" formControlName="description">
        </textarea>

        <mat-error
          *ngIf="dashboardGroupForm.get('description').hasError('required')"
        >
          Required
        </mat-error>
      </mat-form-field>
    </div>
  </div>

  <div style="display: flex; justify-content: flex-end">
    <button type="submit" mat-flat-button color="primary" class="view-button">
      {{ buttonLabel }} Dashboard Group
    </button>
  </div>
</form>
